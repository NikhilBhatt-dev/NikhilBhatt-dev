name: Update Profile Art

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: pip install requests beautifulsoup4

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Render info card
        run: python scripts/make_info_card.py

      - name: Commit generated art
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/heatmap.svg assets/info-card.svg
          git diff --cached --quiet || git commit -m "chore: update profile art [skip ci]"
          git push
